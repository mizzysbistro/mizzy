name: Flutter quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan all branch and tag history for leaked credentials
        run: |
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --exit-code 1 --timeout 300 .


  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate multi-agent loop shell syntax and contracts
        run: |
          bash -n scripts/mizzy-agent-loop.sh
          test -f AGENT.md
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f docs/agent-orchestration.md

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform scaffold in the runner until a local
      # Flutter/Android SDK is available to generate and commit it here.
      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name=mizzy --org=com.mizzysbistro /tmp/mizzy_android_template
          cp -R /tmp/mizzy_android_template/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Install SQLite native library for FFI tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Widget and unit tests (bounded with per-test progress)
        timeout-minutes: 4
        run: timeout 180s flutter test --reporter expanded --concurrency=1

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Record APK SHA-256
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mizzy-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
