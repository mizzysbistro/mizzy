name: Flutter quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform scaffold in the runner until a local
      # Flutter/Android SDK is available to generate and commit it here.
      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name=mizzy --org=com.mizzysbistro /tmp/mizzy_android_template
          cp -R /tmp/mizzy_android_template/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Format and export auth source for validation
        run: |
          dart format lib test
          git diff --check
          for file in lib/features/auth/data/auth_repository.dart lib/features/auth/presentation/auth_entry.dart lib/main.dart test/auth_repository_test.dart; do
            echo "FORMAT_FILE_B64_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_FILE_B64_END:$file"
          done

      - name: Static analysis
        run: flutter analyze

      - name: Install SQLite native library for FFI tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Widget and unit tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mizzy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
