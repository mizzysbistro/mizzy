name: Flutter quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform scaffold in the runner until a local
      # Flutter/Android SDK is available to generate and commit it here.
      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name=mizzy --org=com.mizzysbistro /tmp/mizzy_android_template
          cp -R /tmp/mizzy_android_template/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Widget and unit tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mizzy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
