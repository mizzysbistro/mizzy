workflows:
  mizzy-android-debug:
    name: Mizzy Android debug APK (free-first)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Generate Android platform scaffold
        script: |
          flutter create --platforms=android --project-name=mizzy --org=com.mizzysbistro /tmp/mizzy_android_template
          cp -R /tmp/mizzy_android_template/android ./android

      - name: Install dependencies
        script: flutter pub get

      - name: Check formatting
        script: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        script: flutter analyze

      - name: Install SQLite native library for FFI tests
        script: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Run tests
        script: flutter test

      - name: Build debug APK
        script: flutter build apk --debug

      - name: Record APK checksum
        script: sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/app-debug.apk.sha256

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
