workflows:
  mizzy-android-debug:
    name: Mizzy Android debug APK (free-first)
    max_build_duration: 60
    # Codemagic's individual free quota applies to macOS M2, not Linux X2.
    # Keep this on mac_mini_m2 and do not enable paid usage.
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Generate Android platform scaffold
        script: |
          flutter create --platforms=android --project-name=mizzy --org=com.mizzysbistro /tmp/mizzy_android_template
          cp -R /tmp/mizzy_android_template/android ./android

      - name: Install dependencies
        script: flutter pub get

      - name: Check formatting
        script: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        script: flutter analyze

      # macOS provides SQLite for the sqflite_common_ffi test dependency;
      # do not use Ubuntu-only apt-get commands on this runner.
      - name: Run tests
        script: flutter test

      - name: Build Android debug APK
        script: flutter build apk --debug --target-platform android-arm64

      - name: Record APK SHA-256
        script: shasum -a 256 build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/app-debug.apk.sha256

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
